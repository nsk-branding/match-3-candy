<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pueblo Paleta</title>
    <!-- Icons & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <!-- Phaser 3 & Canvas Confetti CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CAPAS DE FONDO PARALLAX -->
    <div class="parallax-container">
        <div id="bg-layer-1" class="parallax-layer"></div>
        <div id="bg-layer-2" class="parallax-layer"></div>
        <div id="bg-layer-3" class="parallax-layer"></div>
    </div>

    <!-- PANTALLA 1: MAPA DE INICIO CON AVATAR -->
    <div id="map-screen" class="screen map-wrapper active">
        <div class="map-header">
            <img src="img/candy-banner.png" alt="Banner" class="header-banner bouncing-element">
            <h1 class="map-title"><i class="fa-solid fa-star"></i> NIVELES</h1>
            <p id="status-text" class="map-subtitle">Elige un nivel para jugar</p>
        </div>
        
        <div id="map" class="map-container">
            <div id="player-avatar"><i class="fa-solid fa-face-smile"></i></div>
        </div>

        <!-- Personaje Mascota en la Pantalla Principal -->
        <img src="img/character-happy.png" alt="Mascota" class="mascot-character bouncing-element">

        <button class="btn-secondary" onclick="reiniciarProgreso()">
            <i class="fa-solid fa-rotate-left"></i> Volver al Nivel 1
        </button>
    </div>

    <!-- PANTALLA 2: JUEGO -->
    <div id="game-screen" class="screen game-wrapper">
        <div class="hud-card">
            <div class="hud-header">
                <span id="level-title" class="hud-title">Nivel 1</span>
                <span id="target-text" class="hud-target">Meta: 8000 pts</span>
            </div>

            <div class="progress-bar-container">
                <div id="progress-fill" class="progress-bar-fill"></div>
                <i class="fa-solid fa-star star-milestone star-1" id="m-star-1"></i>
                <i class="fa-solid fa-star star-milestone star-2" id="m-star-2"></i>
                <i class="fa-solid fa-star star-milestone star-3" id="m-star-3"></i>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-label"><i class="fa-solid fa-trophy" style="color: var(--accent-gold);"></i> PUNTOS</span>
                    <span class="stat-value" id="score-val">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label"><i class="fa-solid fa-hourglass-half" style="color: var(--accent-cyan);"></i> TURNOS</span>
                    <span class="stat-value" id="moves-val">45</span>
                </div>
            </div>
        </div>

        <!-- Tablero Phaser -->
        <div id="game-container">
            <!-- Modal Normal de Resultado (Ganó / Casi) -->
            <div id="result-modal" class="modal-overlay">
                <div class="modal-card">
                    <img id="modal-character" src="img/character-happy.png" alt="Personaje" class="modal-mascot bouncing-element">
                    <h2 id="modal-status" class="modal-title">¡MUY BIEN!</h2>
                    
                    <div class="stars-container">
                        <i class="fa-solid fa-star star-icon" id="star1"></i>
                        <i class="fa-solid fa-star star-icon" id="star2"></i>
                        <i class="fa-solid fa-star star-icon" id="star3"></i>
                    </div>

                    <p id="modal-score" style="font-size: 20px; font-weight: 600;"></p>

                    <button class="btn-primary" id="modal-action-btn"></button>
                </div>
            </div>

            <!-- Modal de Gran Victoria Final -->
            <div id="final-victory-modal" class="modal-overlay">
                <div class="modal-card final-victory-card">
                    <img src="img/character-victory.png" alt="Victoria" class="final-mascot bouncing-element">
                    <h2 class="modal-title" style="color: var(--accent-gold);">¡FELICIDADES!</h2>
                    <p style="font-size: 22px; font-weight: 700; color: #ffffff;">¡Completaste todo el juego!</p>
                    <p style="font-size: 18px; color: rgba(255,255,255,0.9);">Eres increíble, ¡lo hiciste súper bien!</p>
                    
                    <button class="btn-primary" onclick="volverAlMapaDesdeVictoria()" style="margin-top: 10px;">
                        <i class="fa-solid fa-map-location-dot"></i> Volver al Mapa
                    </button>
                </div>
            </div>
        </div>

        <!-- Paleta Decorativa Lateral -->
        <img src="img/lollipop-decor.png" alt="Lollipop" class="side-lollipop bouncing-element">

        <button class="btn-secondary" id="back-to-map-btn" style="width: 100%; margin-top: 4px;">
            <i class="fa-solid fa-arrow-left"></i> Volver a Niveles
        </button>
    </div>

    <script src="game.js"></script>
</body>
</html>
